<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https://images.unsplash.com; object-src 'none'; base-uri 'self'; form-action 'self'">
    <title>Cat Checklist - Cat sitting</title>
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/bookings.css">
</head>
<body>

<header>
    <h1>Cat sitting bookings</h1>
    <p>A practice booking page: nothing is sent anywhere</p>
</header>

<nav>
    <a href="index.html">Home</a> <span aria-hidden="true">|</span>
    <a href="bookings.html">Bookings</a>|</span>
    <a href="about.html" aria-current="page">About</a> <span aria-hidden="true">|</span>
    <a href="contact.html">Contact</a> <span aria-hidden="true">|</span>
    <a href="mobile.html">Mobile</a> <span aria-hidden="true"></span>
</nav>

<main>
    <p id="prices-status" role="status">Loading prices…</p>

    <form id="booking-form" novalidate aria-describedby="booking-message">
        <div class="fields">
            <div class="field">
                <label for="check-in">Check-in date</label>
                <input type="date" id="check-in" required>
            </div>
            <div class="field">
                <label for="check-out">Check-out date</label>
                <input type="date" id="check-out" required>
            </div>
            <div class="field">
                <label for="cats">Number of cats</label>
                <select id="cats">
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                </select>
            </div>
            <div class="field field-checkbox">
                <input type="checkbox" id="medication">
                <label for="medication">Needs medication</label>
            </div>
        </div>

        <section aria-labelledby="quote-heading">
            <h2 id="quote-heading">Your quote</h2>
            <table aria-labelledby="quote-heading">
                <tbody id="quote-rows"></tbody>
            </table>
        </section>

        <button type="submit" id="book-button" disabled>Book</button>
        <p id="booking-message" aria-live="polite"></p>
    </form>

    <section aria-labelledby="bookings-heading">
        <h2 id="bookings-heading" tabindex="-1">My bookings</h2>
        <p id="no-bookings">No bookings yet.</p>
        <ul id="bookings-list" aria-labelledby="bookings-heading"></ul>
    </section>

    <details>
        <summary>How prices work</summary>
        <ul id="price-rules"></ul>
    </details>
</main>

<footer>
    <p>&copy; 2026 IDA</p>
</footer>

<!-- Page wiring is in src/bookings-page.js; the rules it uses are in src/booking.js (unit tested). -->
<script type="module" src="src/bookings-page.js"></script>
</body>
</html>
