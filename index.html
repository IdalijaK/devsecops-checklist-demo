<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https://images.unsplash.com; object-src 'none'; base-uri 'self'; form-action 'self'">
    <title>Cat Checklist - Home</title>
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/index.css">
</head>
<body class="home-page">

    <!-- header -->
    <header>
        <h1>Welcome to My Website</h1>
        <p>It has a checklist and a cat</p>
    </header>

    <!-- nav -->
    <nav>
    <a href="index.html">Home</a> <span aria-hidden="true">|</span>
    <a href="bookings.html">Bookings</a>|</span>
    <a href="about.html" aria-current="page">About</a> <span aria-hidden="true">|</span>
    <a href="contact.html">Contact</a> <span aria-hidden="true">|</span>
    <a href="mobile.html">Mobile</a> <span aria-hidden="true"></span>
    </nav>

    <hr>

    <!-- header 2 paragraph cute cat image -->
    <main>
        <h2>About This Cat Checklist</h2>
        <p>Minimal homepage that has a cat and a checklist</p>

        <img src="https://images.unsplash.com/photo-1759588032622-1388cf9505ad?q=80&w=1472&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D" alt="Placeholder image of a cute cat that looks like a sunflower">

        <h2 class="checklist-heading">My Cat Checklist</h2>

        <form id="task-form">
            <label for="task-input">Add a task:</label>
            <input id="task-input" type="text" maxlength="100" required>
            <button type="submit">Add task</button>
        </form>

        <ul id="checklist" aria-label="Cat care tasks"></ul>
        <p id="task-status" aria-live="polite"></p>

        <p id="progress" role="status" aria-live="polite">0% done</p>
    </main>


    <hr>
    <!-- footer -->
    <footer>
        <p>&copy; 2026 IDA</p>
    </footer>

    <!-- Page wiring is in src/home.js; the logic it uses is in src/checklist.js. -->
    <script type="module" src="src/home.js"></script>

</body>
</html>
