<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https://images.unsplash.com; object-src 'none'; base-uri 'self'; form-action 'self'">
    <title>Cat Checklist - Contact</title>
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/contact.css">
</head>

<body>

<header>
    <h1>Get in touch with us</h1>
</header>

<nav>
    <a href="index.html">Home</a> <span aria-hidden="true">|</span>
    <a href="bookings.html">Bookings</a>|</span>
    <a href="about.html" aria-current="page">About</a> <span aria-hidden="true">|</span>
    <a href="contact.html">Contact</a> <span aria-hidden="true">|</span>
    <a href="mobile.html">Mobile</a> <span aria-hidden="true"></span>
</nav>

<main>
    <p>This is a demo form for practising tests. Nothing you enter is sent anywhere.</p>

<form id="contact-form" novalidate>
    <label for="name">Name:</label>
    <br>
    <input type="text" id="name" autocomplete="name">
    <br>
    <br>
    <label for="email">Email:</label>
    <br>
    <input type="email" id="email" autocomplete="email" aria-invalid="false" aria-errormessage="form-message">
    <br>
    <br>
    <label for="phone">Phone Number:</label>
    <br>
    <input type="tel" id="phone" autocomplete="tel">
    <br>
    <br>

    <label for="message">Message:</label><br>
    <textarea id="message" rows="4"></textarea><br><br>

    <button type="submit">Send</button>
</form>

<p id="form-message" role="status" aria-live="polite"></p>
</main>

<footer>
    <p>&copy; 2026 IDA</p>
</footer>

<script type="module" src="src/contact.js"></script>

</body>
</html>
