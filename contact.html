<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="css/contact.css">
</head>

<body>

<header>
    <h1>Contact US</h1>
    <p>Get in touch</p>
</header>

<nav>
    <a href="index.html">Home</a> |
    <a href="about.html">About</a> |
    <a href="contact.html">Contact</a>
</nav>

<main>
    <p>Fill your details and we will contact you back</p>

<form id="contact-form" novalidate>
    <label for="name">Name:</label>
    <br>
    <input type="text" id="name">
    <br>
    <br>
    <label for="email">Email:</label>
    <br>
    <input type="email" id="email">
    <br>
    <br>
    <label for="phone">Phone Number:</label>
    <br>
    <input type="tel" id="phone">
    <br>
    <br>

    <label for="message">Message:</label><br>
    <textarea id="message" rows="4"></textarea><br><br>

    <button type="submit">Send</button>
</form>

<p id="form-message" aria-live="polite"></p>
</main>

<footer>
    <p>&copy; 2025 IDA</p>
</footer>

<!-- Same isValidEmail that checklist.test.js covers. -->
<script type="module">
    import { isValidEmail } from "./src/checklist.js";

    const form = document.getElementById("contact-form");
    const message = document.getElementById("form-message");

    form.addEventListener("submit", (event) => {
        event.preventDefault(); // practice site: nothing is actually sent
        const email = document.getElementById("email").value;
        message.textContent = isValidEmail(email)
            ? "Thanks for nothing! We won't be in touch."
            : "Please enter a valid email address.";
    });
</script>

</body>
</html>
