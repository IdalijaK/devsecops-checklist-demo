<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/contact.css">
</head>

<body>

<header>
    <h1>Get in touch with us</h1>
</header>

<nav>
    <a href="index.html">Home</a> |
    <a href="about.html">About</a> |
    <a href="contact.html">Contact</a> |
    <a href="mobile.html">Mobile</a>
</nav>

<main>
    <p>Fill your details and we will contact you back</p>

<form id="contact-form" novalidate>
    <label for="name">Name:</label>
    <br>
    <input type="text" id="name">
    <br>
    <br>
    <label for="email">Email:</label>
    <br>
    <input type="email" id="email" aria-invalid="false" aria-errormessage="form-message">
    <br>
    <br>
    <label for="phone">Phone Number:</label>
    <br>
    <input type="tel" id="phone">
    <br>
    <br>

    <label for="message">Message:</label><br>
    <textarea id="message" rows="4"></textarea><br><br>

    <button type="submit">Send</button>
</form>

<p id="form-message" aria-live="polite"></p>
</main>

<footer>
    <p>&copy; 2025 IDA</p>
</footer>

<!-- Same isValidEmail that checklist.test.js covers. -->
<script type="module">
    import { isValidEmail } from "./src/checklist.js";

    const form = document.getElementById("contact-form");
    const message = document.getElementById("form-message");
    const emailInput = document.getElementById("email");

    form.addEventListener("submit", (event) => {
        event.preventDefault(); // practice site: nothing is actually sent
        const validEmail = isValidEmail(emailInput.value);
        emailInput.setAttribute("aria-invalid", String(!validEmail));
        message.classList.toggle("is-error", !validEmail);
        message.textContent = validEmail
            ? "Thanks! This is a demo form, so nothing was sent."
            : "Please enter a valid email address.";
    });

    emailInput.addEventListener("input", () => {
        if (emailInput.getAttribute("aria-invalid") === "true" && isValidEmail(emailInput.value)) {
            emailInput.setAttribute("aria-invalid", "false");
            message.classList.remove("is-error");
            message.textContent = "";
        }
    });
</script>

</body>
</html>
